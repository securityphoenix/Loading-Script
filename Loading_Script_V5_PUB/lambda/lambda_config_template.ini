# =============================================================================
# Phoenix Lambda Configuration Template
# =============================================================================
# This INI file configures the Phoenix Lambda Handler for serverless
# vulnerability import processing.
#
# IMPORTANT: Store this file in S3 (e.g., s3://bucket/config/lambda_config.ini)
# NEVER put secrets (client_id, client_secret) in this file!
# Use Lambda environment variables for secrets.
#
# S3 Folder Structure:
#   s3://bucket/
#   ├── config/
#   │   └── lambda_config.ini          # This file
#   ├── scanners/
#   │   ├── trivy/
#   │   │   ├── new/                   # Files to process
#   │   │   │   ├── scan.json          # Vulnerability scan
#   │   │   │   └── scan_metadata.yaml # Optional metadata
#   │   │   └── processed/             # Completed files
#   │   ├── grype/
#   │   │   ├── new/
#   │   │   └── processed/
#   │   └── {scanner_name}/            # Any of 205 supported scanners
#   │       ├── new/
#   │       └── processed/
#   └── metadata/
#       └── global_tags.yaml           # Global tags for all imports
# =============================================================================

[phoenix]
# =============================================================================
# Phoenix API Configuration
# =============================================================================
# SECURITY: Use environment variables for credentials!
# Set these in Lambda configuration, not here:
#   - PHOENIX_CLIENT_ID
#   - PHOENIX_CLIENT_SECRET
#
# These values are ONLY used if env vars are not set (for local testing):
client_id = 
client_secret = 

# Phoenix API endpoint
# Options:
#   - https://api.appsecphx.io (production)
#   - https://api.demo.appsecphx.io (demo)
#   - https://api.poc1.appsecphx.io (POC)
api_base_url = https://api.appsecphx.io

# Import type: new, merge, or delta
# - new: Create new assessment with all assets
# - merge: Merge with existing assessment (update existing, add new)
# - delta: Only import changes since last scan
import_type = new

# Assessment name prefix (timestamp will be appended)
# Format: {prefix}_{scanner}_{timestamp}
# Example: Lambda-Import_trivy_20240201_143052
assessment_name_prefix = Lambda-Import

# Wait for Phoenix to confirm import completion
wait_for_completion = true

# Timeout for import completion (seconds)
timeout = 300

# Interval to check import status (seconds)
check_interval = 5

[lambda]
# =============================================================================
# Lambda-Specific Settings
# =============================================================================

# S3 paths configuration
# These define the folder structure in your S3 bucket
scanners_prefix = scanners/
metadata_prefix = metadata/

# Folder names for the two-folder workflow
# Files in new/ are processed, then moved to processed/
new_folder = new
processed_folder = processed

# Temp directory (Lambda has 512MB at /tmp)
temp_dir = /tmp

# Clean up temp files after processing
cleanup_after_processing = true

# Maximum file size to process (MB)
# Lambda /tmp has 512MB limit
max_file_size_mb = 500

[orchestrator]
# =============================================================================
# Orchestrator Mode Settings
# =============================================================================
# Orchestrator scans all new/ folders and invokes individual Lambdas

# Maximum concurrent Lambda invocations
# Adjust based on Phoenix API rate limits
max_concurrent_lambdas = 10

# Lambda function name for file processing
# This should match your deployed function name
function_name = phoenix-file-processor

# Scan interval for scheduled orchestration (minutes)
# Used with EventBridge scheduled triggers
scan_interval_minutes = 15

[batch_processing]
# =============================================================================
# Batch Processing Settings
# =============================================================================
# For large files with many vulnerabilities

# Enable intelligent batching for large payloads
enable_batching = true

# Maximum items per batch (assets or vulnerabilities)
max_batch_size = 100

# Maximum payload size per batch (MB)
max_payload_mb = 25.0

# Retry failed batches
retry_count = 3

# Delay between retries (seconds)
retry_delay = 5

[logging]
# =============================================================================
# Logging Configuration
# =============================================================================
# Logs go to CloudWatch Logs

# Log level: DEBUG, INFO, WARNING, ERROR
level = INFO

# Include HTTP request/response details in logs
# WARNING: May expose sensitive data, use only for debugging
include_request_details = false

# =============================================================================
# SCANNER FOLDER NAMING CONVENTION
# =============================================================================
# The folder name under scanners/ determines the scanner type.
# Use lowercase with underscores. Must match one of 205 supported scanners.
#
# Common Scanner Folder Names:
# -----------------------------------------------------------------------------
# CONTAINER SCANNERS:
#   trivy           - Trivy container/SCA scanner
#   grype           - Anchore Grype vulnerability scanner
#   aqua            - Aqua Security scanner
#   clair           - CoreOS Clair scanner
#   harbor          - Harbor registry scanner
#   docker_bench    - Docker Bench for Security
#
# INFRASTRUCTURE SCANNERS:
#   qualys          - Qualys vulnerability scanner
#   tenable         - Tenable.io/Nessus scanner
#   nexpose         - Rapid7 Nexpose
#   openvas         - OpenVAS scanner
#   nmap            - Nmap network scanner
#
# CLOUD SCANNERS:
#   prowler         - AWS Prowler (v2)
#   prowler_v3      - AWS Prowler v3/v4/v5 (OCSF format)
#   scout_suite     - Scout Suite multi-cloud
#   checkov         - Checkov IaC scanner
#   kics            - KICS IaC scanner
#
# CODE/SAST SCANNERS:
#   sonarqube       - SonarQube code analysis
#   checkmarx       - Checkmarx SAST
#   fortify         - Fortify SAST
#   semgrep         - Semgrep static analysis
#   bandit          - Python security linter
#
# SCA/DEPENDENCY SCANNERS:
#   snyk            - Snyk vulnerability scanner
#   dependency_check - OWASP Dependency Check
#   npm_audit       - npm audit
#   pip_audit       - pip-audit for Python
#   cyclonedx       - CycloneDX SBOM
#
# WEB APPLICATION SCANNERS:
#   burp            - Burp Suite
#   qualys_webapp   - Qualys Web Application Scanner
#   acunetix        - Acunetix scanner
#   nikto           - Nikto web scanner
#   zap             - OWASP ZAP
#
# BUILD/ARTIFACT SCANNERS:
#   jfrog_xray      - JFrog Xray
#   blackduck       - Black Duck SCA
#
# PHOENIX NATIVE CSV:
#   phoenix_csv     - Phoenix native CSV format
#   rapid7_csv      - Rapid7 CSV export
#
# Full list: See README.md in Loading_Script_V5 (205 scanner types)
# =============================================================================

# =============================================================================
# METADATA FILE FORMAT
# =============================================================================
# Metadata files (YAML) can be placed:
# 1. Next to scan file: scan_metadata.yaml (highest priority)
# 2. In scanner folder: scanners/trivy/metadata.yaml
# 3. Global: metadata/global_tags.yaml (lowest priority)
#
# Example metadata.yaml:
# -----------------------------------------------------------------------------
# custom_data:
#   - key: "environment"
#     value: "production"
#   - key: "team"
#     value: "security"
#
# severity_tags:
#   critical:
#     - key: "priority"
#       value: "P1"
#   high:
#     - key: "priority"
#       value: "P2"
#
# asset_type_tags:
#   CONTAINER:
#     - key: "asset-category"
#       value: "container"
#
# compliance_tags:
#   - key: "compliance-framework"
#     value: "SOC2"
# =============================================================================

# =============================================================================
# LAMBDA ENVIRONMENT VARIABLES
# =============================================================================
# Set these in your Lambda function configuration:
#
# Required:
#   PHOENIX_CLIENT_ID     - Phoenix API client ID
#   PHOENIX_CLIENT_SECRET - Phoenix API client secret (PAT)
#
# Optional:
#   PHOENIX_API_URL       - Override API URL from this config
#   S3_BUCKET             - Override bucket from event
#   LOG_LEVEL             - DEBUG, INFO, WARNING, ERROR
# =============================================================================

# =============================================================================
# LAMBDA EVENT EXAMPLES
# =============================================================================
# Single file (S3 trigger or manual):
# {
#   "mode": "single",
#   "bucket": "phoenix-scanner-data",
#   "file_key": "scanners/trivy/new/scan.json",
#   "config_key": "config/lambda_config.ini"
# }
#
# Orchestrator (process all pending):
# {
#   "mode": "orchestrator",
#   "bucket": "phoenix-scanner-data",
#   "config_key": "config/lambda_config.ini"
# }
#
# Orchestrator (specific scanners only):
# {
#   "mode": "orchestrator",
#   "bucket": "phoenix-scanner-data",
#   "config_key": "config/lambda_config.ini",
#   "scanner_filter": ["trivy", "grype", "snyk"],
#   "max_concurrent": 5
# }
# =============================================================================
